name: KidSchedule
options:
  bundleIdPrefix: com.weavejam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

settings:
  base:
    DEVELOPMENT_TEAM: QTKH7M6UMC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  KidSchedule:
    type: application
    platform: iOS
    sources:
      - path: KidSchedule
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weavejam.kidschedule
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KidSchedule/Info.plist
      properties:
        CFBundleDisplayName: KidSchedule
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  KidScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KidScheduleTests
      - path: ../shared-tests/vectors
        buildPhase: resources
        type: group
    dependencies:
      - target: KidSchedule

schemes:
  KidSchedule:
    build:
      targets:
        KidSchedule: all
    test:
      targets:
        - KidScheduleTests
