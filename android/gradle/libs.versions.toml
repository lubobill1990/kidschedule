[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.11"
composeBom = "2026.06.01"
room = "2.8.4"
supabase = "3.7.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
workRuntime = "2.11.1"
glance = "1.1.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
